name: kestrel-base-bench
description: Run Kestrel base-model benches with model-size-scoped artifacts.

codex_contract:
  intent: This file is a Codex-run workflow spec, not a shell-native workflow.
  execution: Codex should fill placeholders from the user prompt, then execute each step.
  model_choice_resolution:
    tiny: [tiny]
    small: [small]
    aight: [aight]
    all: [tiny, small, aight]
  device_resolution:
    auto: Use the accelerator selected by inference runtime.
    cuda: Run on CUDA-capable RunPod or local CUDA environment.
    mps: Run on Apple Silicon MPS locally.
    cpu: Run on CPU only; intended for smoke tests.
  precision_resolution:
    auto: Use backend default precision.
    float32: Force torch.float32.
    float16: Force torch.float16.
    bfloat16: Force torch.bfloat16.
  lora_resolution:
    none:
      adapter_path: null
      artifact_suffix: base
    path:
      adapter_path: "{lora_path}"
      artifact_suffix: "{lora_name}"
  clarification_policy:
    proceed_with_defaults_when_missing:
      split: test
      samples: 256
      batch_size: 8
      precision: auto
      lora: none
      device: auto
      run_prefix: base
    ask_before_running:
      - condition: model_choice is missing and the prompt does not imply a size.
        reason: Model size changes cost, runtime, memory pressure, and artifact names.
      - condition: model_choice=all and samples is greater than 256.
        reason: Running every model size at high sample counts can be expensive.
      - condition: lora=path and lora_path is missing.
        reason: Adapter-backed runs require an explicit PEFT adapter path.
      - condition: lora_path is provided but lora_name is missing or not artifact-safe.
        reason: Adapter artifact names must be stable and non-colliding.
      - condition: device=cuda and CUDA is unavailable in the target environment.
        reason: The requested hardware target is impossible for this run.
      - condition: device=mps and the target environment is not Apple Silicon.
        reason: The requested hardware target is impossible for this run.
      - condition: output artifacts already exist for the resolved run_prefix, artifact_suffix, model_size, device, precision, split, and samples.
        reason: Existing reports should not be overwritten without explicit approval.
      - condition: precision=float16 or precision=bfloat16 on an unsupported target device.
        reason: Unsupported dtype/device combinations can fail or produce misleading results.
    do_not_ask_for:
      - split when omitted.
      - samples when omitted.
      - batch_size when omitted.
      - precision when omitted.
      - lora when omitted.
      - device when omitted.
      - run_prefix when omitted.
  artifact_safety:
      lora_name_pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]*$"
      overwrite_requires_confirmation: true
      prefer_new_run_prefix_over_overwrite: true
  edit_policy:
    read_only_paths:
      - scripts/
    allowed_writes:
      - artifacts/evals/bench/configs/
      - artifacts/evals/bench/
      - assets/
    rule: Do not modify scripts while executing this workflow. If a script fails, report the failure and ask before proposing code changes.

args:
  model_choice:
    description: Qwen-VL base model size to evaluate.
    default: tiny
    choices:
      - tiny
      - small
      - aight
      - all
  split:
    description: Dataset split to evaluate.
    default: test
  samples:
    description: Normalized EvalSample count per dataset.
    default: 256
  batch_size:
    description: Dataset batch size for streamed loader chunks.
    default: 8
  run_prefix:
    description: Artifact prefix. Keep model size in the final resolved name.
    default: base
  device:
    description: Accelerator target for the run. Codex should validate this against the execution environment.
    default: auto
    choices:
      - auto
      - cuda
      - mps
      - cpu
  precision:
    description: Inference dtype policy written into generated config.
    default: auto
    choices:
      - auto
      - float32
      - float16
      - bfloat16
  lora:
    description: Use none for base model, or path for a PEFT adapter run.
    default: none
    choices:
      - none
      - path
  lora_path:
    description: PEFT adapter path when lora=path.
    default: ""
  lora_name:
    description: Artifact-safe adapter name when lora=path.
    default: lora

model_sizes:
  tiny:
    config_size: tiny
    model_id: Qwen/Qwen2-VL-2B-Instruct
  small:
    config_size: small
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
  aight:
    config_size: aight
    model_id: Qwen/Qwen2-VL-7B-Instruct

datasets:
  wide_accuracy:
    - chartqa
    - figureqa
    - chartbench
    - mmc_benchmark
  structured:
    - plotqa

artifact_layout:
  config: artifacts/evals/bench/configs/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}.toml
  jsonl: artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_{dataset}_{split}_{samples}.jsonl
  wide_plot: assets/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_wide_bench_accuracy
  plotqa_plot: assets/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_plotqa_breakdown

generated_config_template:
  path: artifacts/evals/bench/configs/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}.toml
  content: |
    [artifacts]
    root = "artifacts"
    pretrained = "artifacts/pretrained"
    evals = "artifacts/evals"
    datasets = "artifacts/datasets"

    [model]
    default_family = "qwen_vl"
    default_size = "{model_size}"

    [datasets]
    default_streaming = true
    default_window_size = 32

    [inference]
    precision = "{precision}"
    max_new_tokens = 64
    image_max_pixels = 1003520
    {adapter_path_line}

notes:
  - model_choice=all means run tiny, small, then aight.
  - If model_choice is one size, only run that size through every model_size loop.
  - lora=none means adapter_path_line is empty and artifact_suffix resolves to base.
  - lora=path means adapter_path_line resolves to adapter_path = "{lora_path}" and artifact_suffix resolves to lora_name.
  - device is part of artifact names for reproducibility. The current inference config does not consume device directly.
  - Codex should reject device=cuda if the target environment has no CUDA GPU.
  - Output paths include artifact_suffix, model_size, device, and precision to avoid collisions.
  - PlotQA prints its classification report directly from bench.bench.
  - Codex should create generated_config_template.path directly from generated_config_template.content.

steps:
  - name: sync-env
    run: uv sync

  - name: check-accelerator
    codex_condition: run when device is auto, cuda, or cpu
    run: uv run python -c "import torch; print({'cuda': torch.cuda.is_available(), 'device': torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu_or_mps'})"

  - name: create-size-config
    codex_action: materialize generated_config_template for each resolved model_size
    for_each: model_size
    writes:
      - artifacts/evals/bench/configs/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}.toml

  - name: run-wide-benches
    for_each:
      model_size: model_sizes
      dataset: datasets.wide_accuracy
    run: >-
      uv run python -m bench.bench
      --dataset {dataset}
      --split {split}
      --samples {samples}
      --batch-size {batch_size}
      --config artifacts/evals/bench/configs/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}.toml
      --output-path artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_{dataset}_{split}_{samples}.jsonl

  - name: run-plotqa-bench
    for_each:
      model_size: model_sizes
      dataset: datasets.structured
    run: >-
      uv run python -m bench.bench
      --dataset {dataset}
      --split {split}
      --samples {samples}
      --batch-size {batch_size}
      --config artifacts/evals/bench/configs/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}.toml
      --output-path artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_{dataset}_{split}_{samples}.jsonl

  - name: plot-wide-accuracy
    for_each: model_size
    run: >-
      uv run python scripts/plot_bench_accuracy.py
      artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_chartqa_{split}_{samples}.jsonl
      artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_figureqa_{split}_{samples}.jsonl
      artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_chartbench_{split}_{samples}.jsonl
      artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_mmc_benchmark_{split}_{samples}.jsonl
      --title "Qwen-VL {model_size} Wide Bench Accuracy"
      --subtitle "{artifact_suffix}, device={device}, precision={precision}, {samples} normalized {split} samples per dataset"
      --output-dir assets
      --output-name {run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_wide_bench_accuracy

  - name: plot-plotqa-breakdown
    for_each: model_size
    run: >-
      uv run python scripts/plot_plotqa_breakdown.py
      artifacts/evals/bench/{run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_plotqa_{split}_{samples}.jsonl
      --label "Qwen-VL {model_size} {artifact_suffix}"
      --title "PlotQA Structured Extraction Breakdown"
      --subtitle "Qwen-VL {model_size}, {artifact_suffix}, device={device}, precision={precision}, {samples} normalized {split} samples"
      --output-dir assets
      --output-name {run_prefix}_{artifact_suffix}_{model_size}_{device}_{precision}_plotqa_breakdown
